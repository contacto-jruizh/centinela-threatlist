name: brandwatch

# Rastrea clones/typosquat de la marca (dnstwist) y abre un issue con los
# candidatos para revision humana. NO bloquea nada automaticamente.
on:
  schedule:
    - cron: "30 3 * * 1"   # lunes 03:30 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dnstwist y escanear
        run: |
          pip install --quiet dnstwist
          python3 scripts/brandwatch/watch.py --report > candidates.md
          echo "----- candidatos -----"
          cat candidates.md
      - name: Abrir issue si hay candidatos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^| `' candidates.md; then
            gh issue create \
              --title "brandwatch: candidatos $(date -u +%F)" \
              --body-file candidates.md
          else
            echo "brandwatch: sin candidatos nuevos."
          fi
