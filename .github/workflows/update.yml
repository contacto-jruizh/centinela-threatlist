name: update-hosts

on:
  schedule:
    - cron: "0 4 * * 0"  # domingos 04:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 update.py --auto
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update hosts/adlist [skip ci]"
          file_pattern: "hosts adlist.txt data/*/hosts"
