name: update-bulk

# Fuentes agregadas (pesado ~70 MB): vive en la rama `bulk`, NO en main.
# Mensual (dia 1, 04:00 UTC) o manual desde la pestana Actions.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar bulk.txt (agregado + guard Tranco)
        run: python3 update.py --auto
      - name: Publicar bulk.txt en la rama `bulk` (commit unico, sin historial pesado)
        run: |
          git config user.name  "centinela-bot"
          git config user.email "335770001+contacto-jruizh@users.noreply.github.com"
          git checkout --orphan bulk
          git reset
          git add -f bulk.txt
          git commit -m "chore: update bulk [skip ci]"
          git push -f origin bulk
