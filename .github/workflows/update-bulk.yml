name: update-bulk

# Fuentes agregadas POR CATEGORIA -> bulk/*.txt en main.
# Mensual (dia 1, 04:00 UTC) o manual desde la pestana Actions.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generar categorias (bulk/*.txt)
        run: python3 update.py --auto
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: update bulk categories [skip ci]"
          file_pattern: "bulk/*.txt"
