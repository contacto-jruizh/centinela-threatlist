name: update-bulk

# Fuentes agregadas POR CATEGORIA -> bulk/*.txt en main.
# Mensual (dia 1, 04:00 UTC) o manual desde la pestana Actions.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generar categorias (bulk/*.txt)
        run: python3 update.py --auto
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: update bulk categories [skip ci]"
          file_pattern: "bulk/*.txt"
