name: update-curated

# Curaduria manual: rapido, sin red. Se dispara cuando cambian las fuentes
# curadas (blacklist / custom / whitelist / myhosts / el propio generador).
on:
  push:
    branches: [main]
    paths:
      - "blacklist.txt"
      - "data/custom/hosts"
      - "data/custom/ai-hosts"
      - "data/custom/streaming-hosts"
      - "data/custom/social-hosts"
      - "data/custom/vpn-hosts"
      - "data/custom/malware-hosts"
      - "data/custom/microsoft-allow"
      - "data/custom/apple-allow"
      - "data/custom/whatsapp-allow"
      - "data/custom/youtube-allow"
      - "data/custom/banks-allow"
      - "ai-allow.txt"
      - "streaming-allow.txt"
      - "social-allow.txt"
      - "vpn-allow.txt"
      - "whitelist.txt"
      - "myhosts"
      - "update.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generar adlist.txt + hosts + listas IA/streaming/social/vpn + unifi
        run: python3 update.py --curated
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: update curated adlist [skip ci]"
          file_pattern: "adlist.txt hosts ai-block.txt streaming-block.txt social-block.txt vpn-block.txt malware-block.txt microsoft-allow.txt apple-allow.txt whatsapp-allow.txt youtube-allow.txt banks-allow.txt unifi/*.txt"
